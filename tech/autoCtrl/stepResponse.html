    <script>
      function calcStepResponse(zeta/*ζ*/, wn/*ω_n*/, tMax/*模拟时间长度*/, dt/*模拟时间精度*/) {
        var t = [], y = [];
        var yPrev = 0, yDotPrev = 0;
        for (var time = 0; time <= tMax; time += dt) {
          t.push(time);
          y.push(yPrev);
          // 四阶龙格-库塔法求解 ————由小艺AI给出
          var y1 = yPrev, y2 = yDotPrev;
          var k1_y1 = y2;
          var k1_y2 = -2 * zeta * wn * y2 - wn * wn * y1 + wn * wn;
          var k2_y1 = y2 + k1_y2 * dt / 2;
          var k2_y2 = -2 * zeta * wn * (y2 + k1_y2 * dt / 2) - wn * wn * (y1 + k1_y1 * dt / 2) + wn * wn;
          var k3_y1 = y2 + k2_y2 * dt / 2;
          var k3_y2 = -2 * zeta * wn * (y2 + k2_y2 * dt / 2) - wn * wn * (y1 + k2_y1 * dt / 2) + wn * wn;
          var k4_y1 = y2 + k3_y2 * dt;
          var k4_y2 = -2 * zeta * wn * (y2 + k3_y2 * dt) - wn * wn * (y1 + k3_y1 * dt) + wn * wn;
          yPrev = y1 + (k1_y1 + 2 * k2_y1 + 2 * k3_y1 + k4_y1) * dt / 6;
          yDotPrev = y2 + (k1_y2 + 2 * k2_y2 + 2 * k3_y2 + k4_y2) * dt / 6;
        }
        return { t: t, y: y };
      }
      
      function createSVGPlot(t, y, title, color, width, height) {
        var tMin = 0, tMax = Math.max.apply(null, t);
        var yMin = 0, yMax = Math.max.apply(null, y) * 1.2;
        var margin = { top: 30, right: 20, bottom: 40, left: 50 };
        var plotW = width - margin.left - margin.right;
        var plotH = height - margin.top - margin.bottom;
        var scaleX = plotW / (tMax - tMin);
        var scaleY = plotH / (yMax - yMin);
        //绘制网格
        var gridLines = '';
        for (var i = 0; i <= 5; i++) {
          var x = margin.left + i * plotW / 5;
          gridLines += '<line x1="' + x + '" y1="' + margin.top + '" x2="' + x + '" y2="' + (margin.top + plotH) + '" stroke="#e0e0e0" stroke-width="1"/>';
        }
        for (var i = 0; i <= 4; i++) {
          var yy = margin.top + i * plotH / 4;
          gridLines += '<line x1="' + margin.left + '" y1="' + yy + '" x2="' + (margin.left + plotW) + '" y2="' + yy + '" stroke="#e0e0e0" stroke-width="1"/>';
        }
        //坐标轴
        var axes = '<line x1="' + margin.left + '" y1="' + (margin.top + plotH) + '" x2="' + (margin.left + plotW) + '" y2="' + (margin.top + plotH) + '" stroke="#000" stroke-width="2"/>' +
                   '<line x1="' + margin.left + '" y1="' + margin.top + '" x2="' + margin.left + '" y2="' + (margin.top + plotH) + '" stroke="#000" stroke-width="2"/>';
        //xlabel ylabel
        var labels = '<text x="' + (margin.left + plotW / 2) + '" y="' + (height - 5) + '" text-anchor="middle" font-size="12">时间 (秒)</text>' +
                     '<text x="15" y="' + (margin.top + plotH / 2) + '" text-anchor="middle" font-size="12" transform="rotate(-90, 15, ' + (margin.top + plotH / 2) + ')">输出 c(t)</text>';
        //title
        var titleText = '<text x="' + (margin.left + plotW / 2) + '" y="20" text-anchor="middle" font-size="14" font-weight="bold">' + title + '</text>';
        //刻度标签
        var tickLabels = '';
        for (var i = 0; i <= 5; i++) {
          var timeVal = (tMin + i * (tMax - tMin) / 5).toFixed(1);
          var x = margin.left + i * plotW / 5;
          tickLabels += '<text x="' + x + '" y="' + (margin.top + plotH + 15) + '" text-anchor="middle" font-size="10">' + timeVal + '</text>';
        }
        for (var i = 0; i <= 4; i++) {
          var yVal = (yMax - i * (yMax - yMin) / 4).toFixed(2);
          var yy = margin.top + i * plotH / 4;
          tickLabels += '<text x="' + (margin.left - 5) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10">' + yVal + '</text>';
        }
    
        //step(sys)绘制曲线
        var pathD = '';
        for (var i = 0; i < t.length; i++) {
          var px = margin.left + (t[i] - tMin) * scaleX;
          var py = margin.top + plotH - (y[i] - yMin) * scaleY;
          pathD += (i === 0 ? 'M' : 'L') + px + ',' + py;
        }
        var curve = '<path d="' + pathD + '" fill="none" stroke="' + color + '" stroke-width="2"/>';
        //稳态值参考线 y=1
        var ySteady = margin.top + plotH - (1 - yMin) * scaleY;
        var refLine = '<line x1="' + margin.left + '" y1="' + ySteady + '" x2="' + (margin.left + plotW) + '" y2="' + ySteady + '" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>';
        var cr='<text x="5" y="15" font-size="15" style="opacity:0.1314">绘图仅作参考windwhir.top</text>'
        // 组装SVG
        var svg = '<svg width="' + width + '" height="' + height + '" style="background:#fff; border:1px solid #ddd; border-radius:8px;">' +
                  gridLines + axes + cr + labels + titleText + tickLabels + refLine + curve + 
                  '</svg>';
        return svg;
      }
      var zeta=0.2;
      var wn=10;
      var color="#000000"
      var tMax=3;
      var tMaxType="xd"
      var dt = 0.001;
      function showMap(){
        zeta=document.querySelector("#zeta").value;
        if(zeta<0.01||zeta>5){hint("Error\nzeta为无效值");return 1;}
        wn=document.querySelector("#wn").value;
        if(wn<1||wn>100){hint("Error\nwn为无效值");return 1;}
        color=document.querySelector("#color").value;
        mapH=document.querySelector("#mapH").value;
        if(mapH<150){hint("Error\nmapH为无效值");return 1;}
        mapW=document.querySelector("#mapW").value;
        if(mapW<200){hint("Error\nmapW为无效值");return 1;}
        tMax=document.querySelector("#tMax").value;
        if(tMax<1||tMax>200){hint("Error\ntMax为无效值");return 1;}
        tMaxType=document.querySelector("#tMaxType").value;
        if(tMaxType=="xd"){tMax=tMax/wn}
        var zuni="欠阻尼";
        if(zeta==1){zuni="临界阻尼"}else if(zeta>1){zuni="过阻尼"}
        var data = calcStepResponse(zeta, wn, tMax, dt);
        document.querySelector("#show").innerHTML = '<div>' + createSVGPlot(data.t, data.y, `ζ=${zeta}, ωn=${wn}, ${zuni}` , color, mapW , mapH) + '</div>';
      }

      function downloadSvg(filename = '请命名.svg') {
        const svgData = new XMLSerializer().serializeToString(document.querySelector("svg"));
